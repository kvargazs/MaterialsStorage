<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8" />
        <title>Cadastro / Recuperar Senha</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <!-- BOOTSTRAP -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous"/>

        <!-- CSS personalizado -->
        <link rel="stylesheet" href="style/style_home.css"/>
        <link rel="stylesheet" href="style/style_adicionarItem.css" />
        <link rel="stylesheet" href="style/cadastrarUser.css" />
    </head>

    <body>
        <!-- Header -->
        <div class="search">
            <p class="search-titulo">Storage SENAI</p>
        </div>

        <!-- Sidebar -->
        <div class="sidebar">
            <div>
                <ul class="nav nav-pills flex-column mb-auto">
                    <li class="nav-item">
                        <a href="home.html" class="nav-link text-white">Página inicial</a>
                    </li>
                    <li class="nav-item">
                        <a href="adicionarItem.html" class="nav-link text-white">Adicionar Item</a>
                    </li>
                    <li class="nav-item">
                        <a href="historico.html" class="nav-link text-white">Histórico</a>
                    </li>
                    <li class="nav-item" id="menu-historico">
                        <a href="cadastrarUser.html" id="menu-cadastro" class="nav-link text-white active">Cadastrar Usuário</a>
                    </li>
                </ul>
            </div>

            <div class="container_dropdown">
                <hr class="text-white" />
                <div class="dropdown">
                    <button class="btn btn-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">Perfil</button>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="configuracao.html">Configurações</a></li>
                        <li><a class="dropdown-item" href="login.html">Sair</a></li>
                    </ul>
                </div>
            </div>
        </div>

        <!-- Conteúdo Principal -->
        <div class="container_principal">
            <h3 id="titulo" class="titulo_central mb-4">Cadastro de Usuário</h3>

            <!-- Formulário de Cadastro -->
            <div class="containers_cadastro">
                <form class="formCadastro" id="formCadastro" onsubmit="return cadastrarUsuario()">
                    <div class="form-group col-md-6">
                        <label for="cadNome" class="form_nome">Login:</label>
                        <input class="form-control" id="cadNome" placeholder="Digite o login do usuário..." required />
                    </div>
                
                    <div class="form-group col-md-6">
                        <label for="cadSenha">Senha:</label>
                        <input class="form-control" id="cadSenha" placeholder="Digite uma senha para o usuário..." type="password" required />
                    </div>
                
                    <label for="cadTipo">Usuário:</label>
                    <select id="cadTipo" class="form-control mb-3" required>
                        <option value="" disabled selected>Selecione o tipo de usuário</option>
                        <option value="Administrador">Administrador</option>
                        <option value="Usuário">Usuário</option>
                    </select>
                
                    <button type="submit" class="btn btn-primary w-100">Cadastrar</button>
                </form>
                

                <!-- Formulário de Recuperação de Senha -->
                <form id="formRecuperar" class="d-none" onsubmit="return recuperarSenha()">
                    <input type="text" id="recNome" class="form-control mb-3" placeholder="Nome de usuário" required/>
                    <input type="password" id="recNovaSenha" class="form-control mb-3" placeholder="Nova senha" required/>
                    <button type="submit" class="btn btn-success w-100">Alterar senha</button>
                </form>
                <p id="mensagem" class="mt-3 text-center"></p>
            </div>
        </div>

        <!-- Bootstrap JS -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
        <script src="js/cadastrarUser.js"></script>
    </body>
</html>
