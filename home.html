<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- IMPORTANDO FONTE -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

    <!-- BOOTSTRAP -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    
    <!-- CSS -->
    <link rel="stylesheet" href="style/style_home.css?v=1.0">
    <title>Storage SENAI</title>
</head>
<body>
    <!-- BARRA SUPERIOR DE PESQUISA -->
    <div class="search">
        <p class="search-titulo">Storage SENAI</p>
        <div class="search-bar">
            <input class="input-search" type="text" id="search" placeholder="   Pesquise por nome ou código de materiais...">
            <button class="botao-search" type="button" id="buscarBtn">Buscar</button>
        </div>
        <!-- Botão de Filtro -->
        <div class="dropdown d-inline-block ms-3">
            <button class="btn btn-filtro dropdown-toggle" type="button" data-bs-toggle="dropdown">Filtro</button>
            <div class="dropdown-menu p-3" style="min-width: 300px; max-height: 300px; overflow-y: auto;">
                <p><strong>Segmento</strong></p>
                <div id="filtroSegmento">
                    <!-- Checkboxes de segmento via JS -->
                </div>

                <hr>
                <p><strong>Unidade</strong></p>

                <div id="filtroUnidade">
                    <!-- Checkboxes de unidade via JS -->
                </div>
                <hr>
                <div class="d-grid gap-2">
                    <button class="btn btn-primary btn-sm" id="aplicarFiltroBtn">Aplicar Filtro</button>
                    <button class="btn btn-secondary btn-sm" id="limparFiltroBtn">Limpar Filtros</button>
                </div>
            </div>
        </div>
    </div>

    <!-- SIDEBAR -->
    <div class="sidebar">
        <div>
            <ul class="nav nav-pills flex-column mb-auto">
                <li class="nav-item">
                    <a href="home.html" class="nav-link text-white active">Página inicial</a>
                </li>
                <li class="nav-item">
                    <a href="adicionarItem.html" class="nav-link text-white">Adicionar Item</a>
                </li>
                <li class="nav-item">
                    <a href="historico.html" class="nav-link text-white">Histórico</a>
                </li>
            </ul>
        </div>
        <!-- Dropdown do Usuário -->
        <div class="container_dropdown">
            <hr class="text-white">
            <div class="dropdown">
                <button class="btn btn-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">Perfil </button>
                <ul class="dropdown-menu">
                    <li><a class="dropdown-item" href="configuracao.html">Configurações</a></li>
                    <li><a class="dropdown-item" href="login.html">Sair</a></li>
                </ul>
            </div>
        </div>
    </div>

    <section class="container_home">
        <p class="titulo-materiais">MATERIAIS</p>

        <div class="container_itens" id="itens-container"> <!-- itens ficam aq de acordo com o banco --> </div>

        <p class="mensage-vazia" id="mensagem-vazia" style="display: none; text-align: center; margin-top: 20px; color: gray;">Nenhum item encontrado para a pesquisa.</p>
    
        <!-- Modal -->
        <div class="modal fade" id="itemModal" tabindex="-1" aria-labelledby="itemModalLabel">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="modal-nome"></h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                    </div>
                    <div class="modal-body">
                        <p id="modal-segmento">Segmento: </p>
                        <p id="modal-complemento">Complemento: </p>
                        <p id="modal-quantidade">Quantidade: </p>
                        <p id="modal-unidade">Unidade: </p>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-primary" id="editarBtn">Editar</button>
                        <button type="button" class="btn btn-success" id="btnDarBaixa">Dar baixa</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Modal Dar Baixa -->
        <div class="modal fade" id="darBaixaModal" tabindex="-1" aria-labelledby="darBaixaModalLabel">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="darBaixaModalLabel">Dar baixa no item</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                    </div>
                    <div class="modal-body">
                        <p id="nomeCodigoBaixa"><strong>Item: </strong></p>
                        <p id="quantidadeAtualBaixa"><strong>Quantidade atual: </strong></p>
                        <br>
                        <label for="quantidadeBaixa" class="form-label">Quantidade para dar baixa:</label>
                        <input type="number" id="quantidadeBaixa" class="form-control" min="1" placeholder="Digite a quantidade..."/>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="button" class="btn btn-primary" id="confirmarBaixaBtn">Confirmar</button>
                    </div>
                </div>
            </div>
        </div>
    </section>
    

    <!-- BOOTSTRAP -->
    <script src="js/home.js"></script>
    <script src="js/filtros.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
</body>
</html>
