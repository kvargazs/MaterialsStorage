    <div class="container_principal" href="#home">
        <h3 class="titulo_central">Adicionar Item</h3>
        <div class="containers">
            <form id="formulario">
                <div class="form-group col-md-6">
                    <label for="input" class="form_nome">Nome:</label>
                    <input class="form-control" id="input_nome" placeholder="Digite o nome do item...">
                </div>
                <div class="form-group col-md-6">
                    <label for="inputPassword4">Complemento:</label>
                    <input class="form-control" id="input_complemento" placeholder="Digite o complemento do item...">
                </div>
                <div class="form-group">
                    <label for="input">Código:</label>
                    <input type="number" class="form-control" id="input_codigo" placeholder="Digite o código do item...">
                </div>
                <div class="form-group">
                    <label for="input">Quantidade:</label>
                    <input type="number" class="form-control" id="input_quantidade" placeholder="Digite a quantidade de itens...">
                </div>
                <div class="form-row selecionaveis">
                    <div class="form-group col-md-6">
                        <label for="input_unidade">Unidade:</label>
                        <select id="input_unidade" class="form-control">
                            <option value="" disabled selected>Selecione a opção de unidade</option>
                            <option value="Peça">Peça</option>
                            <option value="Caixa">Caixa</option>
                            <option value="Unidade">Unidade</option>
                            <option value="Milimetro">Milímetro</option>
                            <option value="Centimetro">Centímetro</option>
                            <option value="Metro">Metro</option>
                            <option value="Quilometro">Quilometro</option>
                            <option value="Quilograma">Quilograma</option>
                        </select>
                    </div>

                    <div class="form-group col-md-6">
                        <label for="input_segmento">Segmento:</label>
                        <select id="input_segmento" class="form-control">
                            <option value="" disabled selected>Selecione a opção de segmento</option>
                            <option value="Aços e polimeros">Aços e polimeros</option>
                            <option value="Alimentos">Alimentos</option>
                            <option value="Assinatura de periódico">Assinatura de periódico</option>
                            <option value="Automotivos">Automotivos</option>
                            <option value="Brinquedo pedagógico">Brinquedo pedagógico</option>
                            <option value="Coleta de resíduos">Coleta de resíduos</option>
                            <option value="Coletores, Contentores, Lixeiras">Coletores, Contentores, Lixeiras</option>
                            <option value="Construção Civil">Construção Civil</option>
                            <option value="Consultoria">Consultoria</option>
                            <option value="Capa e Cozinha">Capa e Cozinha</option>
                            <option value="Couro e Calçado">Couro e Calçado</option>
                            <option value="Credenciamento">Credenciamento</option>
                            <option value="Edição de livros">Edição de livros</option>
                            <option value="Elementos de fixação">Elementos de fixação</option>
                            <option value="Elementos de máquina">Elementos de máquina</option>
                            <option value="Elétrica">Elétrica</option>
                            <option value="Eletrônica">Eletrônica</option>
                            <option value="Embalagens e descartáveis">Embalagens e descartáveis</option>
                            <option value="EPI's">EPI's</option>
                            <option value="Escolar/Expediente">Escolar/Expediente</option>
                            <option value="Esportivo">Esportivo</option>
                            <option value="Ferramenta elétrica">Ferramenta elétrica</option>
                            <option value="Ferramenta manual">Ferramenta manual</option>
                            <option value="Funcional">Funcional</option>
                            <option value="Gás natural">Gás natural</option>
                            <option value="Gemologia">Gemologia</option>
                            <option value="Gestão de patrimônio">Gestão de patrimônio</option>
                            <option value="Gráfica">Gráfica</option>
                            <option value="Higiene e limpeza">Higiene e limpeza</option>
                            <option value="Impresso">Impresso</option>
                            <option value="Informática">Informática</option>
                            <option value="Instalação de rede lógica">Instalação de rede lógica</option>
                            <option value="Instrumento de medição">Instrumento de medição</option>
                            <option value="Investimento">Investimento</option>
                            <option value="Laboratório">Laboratório</option>
                            <option value="Mecânica">Mecânica</option>
                            <option value="Manutenção condomínio">Manutenção condomínio</option>
                            <option value="Manutenção de máquina">Manutenção de máquina</option>
                            <option value="Manutenção integrada">Manutenção integrada</option>
                            <option value="Marcenaria">Marcenaria</option>
                            <option value="Odontologia">Odontologia</option>
                            <option value="Óleos e lubrificantes">Óleos e lubrificantes</option>
                            <option value="Olimpíadas">Olimpíadas</option>
                            <option value="Pilhas e baterias">Pilhas e baterias</option>
                            <option value="Pneumática e hidráulica">Pneumática e hidráulica</option>
                            <option value="Projetos">Projetos</option>
                            <option value="Redes de distribuição elétrica">Redes de distribuição elétrica</option>
                            <option value="Refrigeração">Refrigeração</option>
                            <option value="Serralheria">Serralheria</option>
                            <option value="Serviço">Serviço</option>
                            <option value="Serviço de obra e engenharia">Serviço de obra e engenharia</option>
                            <option value="Serviço terceirizado">Serviço terceirizado</option>
                            <option value="Software">Software</option>
                            <option value="Solda">Solda</option>
                            <option value="Telecomunicação">Telecomunicação</option>
                            <option value="Têxtil">Têxtil</option>
                            <option value="Uniformes">Uniformes</option>
                            <option value="Usinagem - Acessórios">Usinagem - Acessórios</option>
                            <option value="Usinagem - HSS">Usinagem - HSS</option>
                            <option value="Usinagem - Inteiriças">Usinagem - Inteiriças</option>
                            <option value="Usinagem - Marcenaria e Construção civil">Usinagem - Marcenaria e Construção civil</option>
                            <option value="Usinagem - Metal duro">Usinagem - Metal duro</option>
                            <option value="Usinagem - Pastilhas">Usinagem - Pastilhas</option>
                            <option value="Vale Transporte">Vale Transporte</option>
                        </select>
                    </div>
                </div>


                <div class="botao_enviar_item">
                    <button type="button" class="btn btn-primary botao_enviar" onclick="EnviarItem()">Salvar</button>
                </div>
