<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- IMPORTANDO FONTE -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet"/>

    <!-- BOOTSTRAP -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous"/>

    <!-- CSS -->
    <link rel="stylesheet" href="style/style.login.css" />
    <title>Login</title>
</head>
<body>
    <!-- BARRA SUPERIOR DE PESQUISA -->
    <div class="search">
        <p class="search-titulo">Storage SENAI</p>
        <div class="search-bar"></div>
    </div>

    <div class="central">
        <div class="caixa_de_login">
            <h1>Login</h1>
            <img class="icone_login" src="img/icon_user.svg" alt=""/>
            <div class="form-group col-md-6 login_nome_div">
                <label for="login_nome_input" class="login_nome_label">Nome:</label>
                <input class="form-control" id="login_nome_input" name="nome" placeholder="Digite o seu nome..."/>
            </div>
            <div class="form-group col-md-6 login_senha_div">
                <label for="login_senha_input" class="login_senha_label">Senha:</label>
                <input type="password" class="form-control" id="login_senha_input" name="senha" placeholder="Digite a sua senha..."/>
            </div>
            <div class="esqueci-senha text-end">
                <a href="#" id="btnEsqueciSenha">Esqueci minha senha</a>
            </div>
            <div class="botao_fazer_login">
                <button type="button" class="btn btn-primary botao_login" id="btnLogin">Login</button>
            </div>
        </div>
    </div>

    <!-- Modal de Recuperação de Senha -->
    <div class="modal fade" id="recuperarSenhaModal" tabindex="-1" aria-labelledby="recuperarSenhaModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="formRecuperarSenha">
                    <div class="modal-header">
                        <h5 class="modal-title" id="recuperarSenhaModalLabel">Recuperar Senha</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label for="nomeUsuarioModal" class="form-label">Nome de usuário</label>
                            <input type="text" class="form-control" id="nomeUsuarioModal" placeholder="Digite o user que deseja mudar a senha..."/>
                        </div>
                        <div class="mb-3">
                            <label for="novaSenhaModal" class="form-label">Nova senha</label>
                            <input type="password" class="form-control" id="novaSenhaModal" placeholder="Digite a nova senha..." required/>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-success">Alterar senha</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>

    <script src="js/fazerLogin.js"></script>
</body>
</html>
